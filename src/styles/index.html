<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../dev/styles/main.css">
</head>
<body>
    <div class="container">
        <section class="paceCalc">
            <h1>Calculadora</h1>
            <h2>Calcule seu Pace:</h2>
            <form id="calc">
                <div class="tempo">
                    <label for="time">
                        Tempo total (min):
                    </label>
                <input type="time" id="time" required>
                </div>
                <div class="distancia">
                    <label for="distancia">
                        Distancia total (Km):
                    </label>
                    <input type="number" id="distancia" min="0" step="0.1" required>
                </div>
                <div class="btnCalc">
                    <button type="submit">
                        Calcular
                    </button>
                </div>
            </form>
            <div class="resultado">
                O seu pace é de: <span id="resultado-valor"></span>
            </div>
        </section>
    </div>
    <script src="../scripts/main.js"></script>
</body> 
</html>
