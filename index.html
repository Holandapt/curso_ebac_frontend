<!DOCTYPE html>
<html lang="pt=bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="form-group">
            <div class="col-md-6 offset-md-3 mt-5">
                <div class="row">
                    <div class="col">
                        <h2>Entre em contato</h2>
                        <form>
                            <input class="form-control mb-2 w-50" type="text" placeholder="Seu nome" id="nome">
                            <input class="form-control mb-2 w-50" type="email" placeholder="Seu email" id="email">
                            <input class="form-control mb-2 w-50" type="tel" placeholder="Seu telefone" id="telefone">
                            <div class="form-check form-switch">
                                <label class="form-check-label" for="aceito-temos">Li e concordo com os termos do site</label>
                                <input class="form-check-input mb-2" type="checkbox" id="aceito-termos">
                            </div>
                            <button class="btn btn-success mt-2">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
